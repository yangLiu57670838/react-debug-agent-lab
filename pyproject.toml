[project]
name = "react-debug-agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
format = "tasks:format"
main = "tasks:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tasks"
module-root = ""

[tool.isort]
profile = "black"
skip_glob = [".venv/**"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
]
